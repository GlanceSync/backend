micronaut.application.name=GlanceSync
micronaut.server.port=${SERVER_PORT:8083}

datasources.default.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5440}/${DB_NAME:glancesync_db}
datasources.default.username=${DB_USER:glancesync}
datasources.default.password=${DB_PASSWORD:glancesync}
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.maximum-pool-size=10

# JWT: a short-lived access token (Authorization header) and a refresh token (HttpOnly cookie).
# The secret is base64 and must decode to at least 32 bytes: openssl rand -base64 32
glancesync.security.jwt.secret-key=${JWT_SECRET_KEY}
glancesync.security.jwt.expiration-time=${JWT_EXPIRATION_TIME:900000}
glancesync.security.jwt.refresh-expiration-time=${JWT_REFRESH_EXPIRATION_TIME:604800000}
glancesync.security.cookie-secure=${COOKIE_SECURE:false}

# The Angular dev server needs credentialed cross-origin requests during development.
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.dev.allowed-origins=http://localhost:4201,http://localhost:4200
micronaut.server.cors.configurations.dev.allow-credentials=true

# TURN relay for calls between networks that cannot reach each other directly.
# The secret is shared with coturn (static-auth-secret); empty disables TURN.
glancesync.turn.secret=${TURN_SECRET:}
glancesync.turn.urls=${TURN_URLS:}

# Swagger UI at /swagger-ui, the generated spec at /swagger/glancesync-<version>.yml
micronaut.router.static-resources.swagger.paths=classpath:META-INF/swagger
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger-ui.paths=classpath:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**

# Public address of the app; links in emails point here (the API is served under /api).
glancesync.app-url=${APP_URL:http://localhost:4200}

# Outgoing email (verification links). An empty host logs emails instead of sending them.
glancesync.mail.host=${MAIL_HOST:}
glancesync.mail.port=${MAIL_PORT:587}
glancesync.mail.username=${MAIL_USERNAME:}
glancesync.mail.password=${MAIL_PASSWORD:}
glancesync.mail.starttls=${MAIL_STARTTLS:true}
glancesync.mail.from=${MAIL_FROM:GlanceSync <no-reply@glancesync.local>}

# How long the link in a verification email stays valid.
glancesync.security.verification-expiration-minutes=${SECURITY_VERIFICATION_EXPIRATION_MINUTES:15}
