server.port=${SERVER_PORT:8080}

# JSON leaves out null fields but always sends lists, even empty ones. The default
# (non_empty) drops [] too, so a new user's profile arrived without "interests" or
# "pictures" and the frontend crashed iterating them.

datasources.default.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5440}/${DB_NAME:glancesync_db}
datasources.default.username=${DB_USER:glancesync}
datasources.default.password=${DB_PASSWORD:glancesync}
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.maximum-pool-size=10

# What startup does to the schema, like Hibernate's ddl-auto:
#   none        leave the database alone
#   validate    fail startup if a table or column from schema.sql is missing or has the wrong type
#   update      apply schema.sql, which only adds what is missing (keeps all data)
#   create      DROP EVERYTHING, then apply schema.sql
#   create-drop like create, and drop everything again on shutdown
glancesync.db.ddl-auto=${DB_DDL_AUTO:update}
# Load the 500 test profiles (password Glance2026!). Only adds rows that are missing.
# Never enable it in production.
glancesync.db.seed=${DB_SEED:false}

# JWT: a short-lived access token (Authorization header) and a refresh token (HttpOnly cookie).
# The secret is base64 and must decode to at least 32 bytes: openssl rand -base64 32
glancesync.security.jwt.secret-key=${JWT_SECRET_KEY}
glancesync.security.jwt.expiration-time=${JWT_EXPIRATION_TIME:900000}
glancesync.security.jwt.refresh-expiration-time=${JWT_REFRESH_EXPIRATION_TIME:604800000}
glancesync.security.cookie-secure=${COOKIE_SECURE:false}

# The Angular dev server needs credentialed cross-origin requests during development.
server.cors.allowed-origins=http://localhost:4201,http://localhost:4200

# Spark-native OpenAPI document and Swagger UI are exposed at /swagger and /swagger-ui.html.

# Where uploaded pictures are stored on disk, one folder per user. Relative paths
# resolve against the working directory.
glancesync.pictures.storage-path=${IMG_STORAGE_PATH:./data/images}

# TURN relay for calls between networks that cannot reach each other directly.
# The secret is shared with coturn (static-auth-secret); empty disables TURN.
glancesync.turn.secret=${TURN_SECRET:}
glancesync.turn.urls=${TURN_URLS:}

# Public address of the app; links in emails point here (the API is served under /api).
glancesync.app-url=${APP_URL:http://localhost:4200}

# Outgoing email (verification links). An empty host logs emails instead of sending them.
glancesync.mail.host=${MAIL_HOST:}
glancesync.mail.port=${MAIL_PORT:587}
glancesync.mail.username=${MAIL_USERNAME:}
glancesync.mail.password=${MAIL_PASSWORD:}
glancesync.mail.starttls=${MAIL_STARTTLS:true}
glancesync.mail.from=${MAIL_FROM:GlanceSync <no-reply@glancesync.local>}

# How long the link in a verification email stays valid.
glancesync.security.verification-expiration-minutes=${SECURITY_VERIFICATION_EXPIRATION_MINUTES:15}

# OAuth sign-in keeps its state in an in-memory session between /api/auth/{provider} and the callback.

# Intra 42 oauth
glancesync.oauth.providers.42.client-id=${OAUTH_42_CLIENT_ID:}
glancesync.oauth.providers.42.client-secret=${OAUTH_42_CLIENT_SECRET:}
glancesync.oauth.providers.42.authorize-url=${OAUTH_42_AUTHORIZE_URL:https://api.intra.42.fr/oauth/authorize}
glancesync.oauth.providers.42.token-url=${OAUTH_42_TOKEN_URL:https://api.intra.42.fr/oauth/token}
glancesync.oauth.providers.42.userinfo-url=${OAUTH_42_ME_URL:https://api.intra.42.fr/v2/me}
glancesync.oauth.providers.42.redirect-uri=${OAUTH_42_REDIRECT_URI:http://localhost:4200/auth/42/callback}

# Google oauth
glancesync.oauth.providers.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:}
glancesync.oauth.providers.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:}
glancesync.oauth.providers.google.authorize-url=${OAUTH_GOOGLE_AUTHORIZE_URL:https://accounts.google.com/o/oauth2/v2/auth}
glancesync.oauth.providers.google.token-url=${OAUTH_GOOGLE_TOKEN_URL:https://oauth2.googleapis.com/token}
glancesync.oauth.providers.google.userinfo-url=${OAUTH_GOOGLE_USERINFO_URL:https://www.googleapis.com/oauth2/v3/userinfo}
glancesync.oauth.providers.google.redirect-uri=${OAUTH_GOOGLE_REDIRECT_URI:http://localhost:4200/auth/google/callback}

# Facebook oauth
glancesync.oauth.providers.facebook.client-id=${OAUTH_FACEBOOK_CLIENT_ID:}
glancesync.oauth.providers.facebook.client-secret=${OAUTH_FACEBOOK_CLIENT_SECRET:}
glancesync.oauth.providers.facebook.authorize-url=${OAUTH_FACEBOOK_AUTHORIZE_URL:https://www.facebook.com/v19.0/dialog/oauth}
glancesync.oauth.providers.facebook.token-url=${OAUTH_FACEBOOK_TOKEN_URL:https://graph.facebook.com/v19.0/oauth/access_token}
glancesync.oauth.providers.facebook.userinfo-url=${OAUTH_FACEBOOK_USERINFO_URL:https://graph.facebook.com/me}
glancesync.oauth.providers.facebook.redirect-uri=${OAUTH_FACEBOOK_REDIRECT_URI:http://localhost:4200/auth/facebook/callback}
