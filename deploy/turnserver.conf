# coturn: relays call media when two browsers cannot reach each other directly
# (mobile data, hotspots, strict NATs, client-isolated Wi-Fi).
#
#   sudo apt install coturn
#   sudo cp deploy/turnserver.conf /etc/turnserver.conf    # then set static-auth-secret
#   sudo ufw allow 3478/udp && sudo ufw allow 3478/tcp && sudo ufw allow 49160:49260/udp
#   sudo systemctl enable --now coturn
#
# The backend mints short-lived credentials from the same secret (TURN_SECRET in
# ~/glancesync-backend/.env), so the two values must match.

listening-port=3478
listening-ip=57.129.77.121
relay-ip=57.129.77.121
external-ip=57.129.77.121

# The UDP range media is relayed on; must match the firewall rule above.
min-port=49160
max-port=49260

realm=chat-live.online
server-name=chat-live.online
fingerprint

use-auth-secret
static-auth-secret=change_me

# Plain TURN only; TURN over TLS would need port 443, which nginx owns.
no-tls
no-dtls
no-cli

# A relay must never become a way into this machine or private networks: without
# these, anyone with credentials could reach services such as Postgres through it.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=57.129.77.121

# Keep one user or a flood of allocations from exhausting the port range.
user-quota=12
total-quota=100
stale-nonce=600

syslog
simple-log
