# GlanceSync reverse proxy.
#   sudo cp nginx.conf /etc/nginx/sites-available/glancesync
#   sudo ln -s /etc/nginx/sites-available/glancesync /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your-domain   # adds the TLS block below

server {
    listen 80;
    server_name your-domain;

    # The API and the WebSocket must be same-origin as the app, or the session
    # cookie will not be sent with them.
    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chat, presence, notifications and call signalling all ride this one socket.
    location /ws {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        # A quiet socket must not be culled; presence depends on it staying open.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }

    # Everything else is the server-rendered Angular app.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
