
services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-glancesync_db}
      POSTGRES_USER: ${DB_USER:-glancesync}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5440}:5432"
    volumes:
      - glancesync-db:/var/lib/postgresql/data

volumes:
  glancesync-db:
